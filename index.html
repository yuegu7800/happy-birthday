<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101826">
  <title>生日快乐</title>
  <style>
    :root{--ink:#101826;--paper:#f4f6f8;--rose:#ef476f;--gold:#ffd166;--mint:#77d6b3;--blue:#69b7dd}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--ink);font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif}
    body{overflow:hidden;color:var(--paper);touch-action:manipulation}
    .stage{position:relative;display:grid;place-items:center;min-height:100dvh;overflow:hidden;background:radial-gradient(circle at 50% 42%,#23354b 0,#101826 52%,#090e16 100%)}
    canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
    .content{position:relative;z-index:2;width:min(92vw,520px);padding:calc(28px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));text-align:center}
    .eyebrow{margin:0 0 8px;color:#bfc9d4;font-size:12px;font-weight:700;letter-spacing:0;text-transform:uppercase}
    h1{margin:0;color:#fff;font-size:clamp(40px,12vw,72px);line-height:1.05;letter-spacing:0;text-wrap:balance;text-shadow:0 8px 32px #0008}
    .name{display:block;overflow-wrap:anywhere;color:var(--gold)}
    .wish{max-width:26em;margin:14px auto 0;color:#d9e0e7;font-size:15px;line-height:1.7}
    .cake-wrap{position:relative;width:min(84vw,380px);aspect-ratio:1/1;margin:8px auto -10px;filter:drop-shadow(0 30px 24px #0006)}
    .cake-wrap svg{display:block;width:100%;height:100%}
    .flame{transform-origin:center bottom;animation:flicker .7s ease-in-out infinite alternate;opacity:0;transition:opacity .45s}
    .lit .flame{opacity:1}.lit .wick{stroke:#41332d}.glow{opacity:0;transition:opacity .5s}.lit .glow{opacity:.75}
    .actions{display:flex;justify-content:center;gap:10px}
    button{min-width:148px;min-height:48px;border:0;border-radius:8px;background:var(--rose);color:#fff;font:700 15px/1 inherit;box-shadow:0 10px 24px #0005;cursor:pointer;transition:transform .16s,background .16s}
    button:active{transform:scale(.97)}button:focus-visible{outline:3px solid #fff;outline-offset:3px}
    .hint{margin:12px 0 0;color:#8996a6;font-size:12px}
    @keyframes flicker{from{transform:rotate(-2deg) scale(.92,1.04)}to{transform:rotate(3deg) scale(1.08,.94)}}
    @media (max-height:680px){h1{font-size:38px}.cake-wrap{width:min(58vh,300px);margin:-2px auto -14px}.content{padding-top:18px}.wish{margin-top:8px}}
    @media (prefers-reduced-motion:reduce){.flame{animation:none}button{transition:none}}
  </style>
</head>
<body>
  <main class="stage" id="stage">
    <canvas id="confetti" aria-hidden="true"></canvas>
    <section class="content" aria-label="生日祝福">
      <p class="eyebrow">A LITTLE CELEBRATION FOR YOU</p>
      <h1>生日快乐<span class="name" id="name"></span></h1>
      <p class="wish" id="wish">愿新一岁的每一天，都有好消息、好心情，也有被惦记的温柔。</p>
      <div class="cake-wrap" aria-label="一只点着蜡烛的生日蛋糕">
        <svg viewBox="0 0 400 400" role="img" aria-hidden="true">
          <defs><radialGradient id="g" cx="50%" cy="45%"><stop offset="0" stop-color="#ffd166"/><stop offset="1" stop-color="#ffd166" stop-opacity="0"/></radialGradient></defs>
          <ellipse class="glow" cx="200" cy="100" rx="110" ry="85" fill="url(#g)"/>
          <ellipse cx="200" cy="340" rx="154" ry="32" fill="#080d15" opacity=".38"/>
          <ellipse cx="200" cy="312" rx="150" ry="35" fill="#dce7ef"/><path d="M50 308v18c0 20 67 36 150 36s150-16 150-36v-18" fill="#a9c5d8"/><ellipse cx="200" cy="308" rx="150" ry="35" fill="#eff6f8"/>
          <path d="M76 235v65c0 29 55 51 124 51s124-22 124-51v-65z" fill="#73c5dc"/><ellipse cx="200" cy="235" rx="124" ry="47" fill="#f8fbfd"/>
          <path d="M76 237c16 14 27 4 39 19 13 16 28-8 43 8 17 17 30-11 49 3 18 14 27-14 48 0 18 12 34-12 50-1 13 9 24 1 39-11v-21H76z" fill="#fff"/>
          <g fill="#ef476f"><circle cx="116" cy="283" r="4"/><circle cx="154" cy="305" r="3"/><circle cx="218" cy="294" r="4"/><circle cx="275" cy="276" r="3"/></g>
          <g fill="#ffd166"><circle cx="137" cy="270" r="3"/><circle cx="188" cy="312" r="4"/><circle cx="249" cy="304" r="3"/></g>
          <path d="M133 167v65c0 19 30 34 67 34s67-15 67-34v-65z" fill="#e84545"/><ellipse cx="200" cy="167" rx="67" ry="28" fill="#ff9c6b"/>
          <path d="M133 168c9 8 17 4 25 15 9 12 21-11 33 2 14 15 24-9 38 2 12 10 23-5 38-14v-7h-134z" fill="#ffb18b"/>
          <g stroke="#fff" stroke-width="5" stroke-linecap="round">
            <path d="M160 116v50"/><path d="M187 110v53"/><path d="M214 111v52"/><path d="M241 116v50"/>
          </g>
          <g stroke="#69b7dd" stroke-width="3"><path d="M157 128l6 7-6 7 6 7"/><path d="M184 122l6 7-6 7 6 7"/><path d="M211 123l6 7-6 7 6 7"/><path d="M238 128l6 7-6 7 6 7"/></g>
          <g class="wick" stroke="#eee" stroke-width="2"><path d="M160 116v-7"/><path d="M187 110v-7"/><path d="M214 111v-7"/><path d="M241 116v-7"/></g>
          <g class="flame" fill="#ffd166"><path d="M160 108c-10-9 2-20 1-27 11 10 12 21-1 27"/><path d="M187 102c-10-9 2-20 1-27 11 10 12 21-1 27"/><path d="M214 103c-10-9 2-20 1-27 11 10 12 21-1 27"/><path d="M241 108c-10-9 2-20 1-27 11 10 12 21-1 27"/></g>
        </svg>
      </div>
      <div class="actions"><button id="celebrate" type="button">点亮生日蜡烛</button></div>
      <p class="hint">点击按钮，收下今天的祝福</p>
    </section>
  </main>
  <script>
    const params=new URLSearchParams(location.search);const person=params.get('name');const customWish=params.get('wish');
    if(person)document.querySelector('#name').textContent='，'+person;if(customWish)document.querySelector('#wish').textContent=customWish;
    const canvas=document.querySelector('#confetti'),ctx=canvas.getContext('2d'),stage=document.querySelector('#stage'),button=document.querySelector('#celebrate');
    let pieces=[],raf,started=false;const colors=['#ef476f','#ffd166','#77d6b3','#69b7dd','#f4f6f8'];
    function size(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',size);size();
    function burst(){pieces=Array.from({length:150},()=>({x:innerWidth/2+(Math.random()-.5)*100,y:innerHeight*.52,vx:(Math.random()-.5)*12,vy:-Math.random()*12-4,r:Math.random()*5+3,a:Math.random()*6.28,va:(Math.random()-.5)*.25,c:colors[Math.floor(Math.random()*colors.length)],life:1}));cancelAnimationFrame(raf);draw()}
    function draw(){ctx.clearRect(0,0,innerWidth,innerHeight);pieces.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.22;p.a+=p.va;p.life-=.006;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r);ctx.restore()});pieces=pieces.filter(p=>p.life>0&&p.y<innerHeight+20);if(pieces.length)raf=requestAnimationFrame(draw)}
    function melody(){if(!window.AudioContext&&!window.webkitAudioContext)return;const A=window.AudioContext||window.webkitAudioContext,ac=new A(),notes=[392,392,440,392,523,494,392,392,440,392,587,523,392,392,784,659,523,494,440,698,698,659,523,587,523];let t=ac.currentTime+.05;notes.forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain(),long=[3,5,9,11,15,19,24].includes(i);o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.09,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+(long?.42:.22));o.connect(g).connect(ac.destination);o.start(t);o.stop(t+(long?.44:.24));t+=long?.42:.24})}
    button.addEventListener('click',()=>{stage.classList.add('lit');burst();if(!started){melody();started=true}button.textContent='再庆祝一次';navigator.vibrate?.(35)});
  </script>
</body>
</html>
